<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>משה גינזי — קהילה</title>
<style>
:root {
  --bg:#0d0d0d; --card:rgba(25,25,28,0.85); --input:rgba(45,45,50,0.6);
  --gold:#c9a84c; --gold-l:#e8d48b; --gold-dim:rgba(201,168,76,0.15); --gold-b:rgba(201,168,76,0.25);
  --white:#f0ece2; --pri:#e8e4da; --sec:#9e9a90; --muted:#6b6860;
  --border:rgba(255,255,255,0.07); --ok:#5dba72; --ok-bg:rgba(93,186,114,0.12);
  --err:#d45555; --err-bg:rgba(212,85,85,0.12);
  --font:'Segoe UI',-apple-system,Arial,sans-serif;
  --r:14px; --rs:10px;
}
.light {
  --bg:#faf7f0; --card:rgba(255,255,255,0.92); --input:rgba(245,242,235,0.8);
  --gold:#9e7c2e; --gold-l:#c9a84c; --gold-dim:rgba(158,124,46,0.1); --gold-b:rgba(158,124,46,0.2);
  --white:#1a1a2e; --pri:#2c2c3e; --sec:#5a5a6e; --muted:#8a8a98;
  --border:rgba(0,0,0,0.08); --ok:#2d8a56; --ok-bg:rgba(45,138,86,0.08);
  --err:#c44040; --err-bg:rgba(196,64,64,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--pri);min-height:100vh;max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent;padding-bottom:64px}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
textarea{font-family:var(--font)}
.glass{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;box-shadow:0 3px 16px rgba(0,0,0,0.25)}
.glass.glow{border-color:var(--gold-b);box-shadow:0 0 24px rgba(201,168,76,0.06)}
.badge{background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600;border:1px solid var(--gold-b);display:inline-block}
.avatar{border-radius:50%;background:rgba(201,168,76,0.12);border:1.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;flex-shrink:0}
.gold-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#0d0d0d;padding:12px 22px;border-radius:var(--rs);font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(201,168,76,0.2);transition:all 0.2s;width:100%}
.light .gold-btn{color:#fff}
.gold-btn:disabled{background:var(--border);color:var(--muted);box-shadow:none}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;padding:13px 20px;border-radius:var(--r);font-size:15px;font-weight:600;width:100%}
.header{padding:16px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:21;background:var(--bg)}.header-left{display:flex;align-items:center;gap:12px}
.header img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.header h1{font-size:19px;font-weight:700;color:var(--gold);font-style:italic}
.header .sub{font-size:11px;color:var(--muted);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{background:var(--border);border-radius:20px;padding:6px 10px;font-size:14px}
.lang-wrap{display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--gold-b)}
.lang-btn{padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);transition:0.2s}
.lang-btn.active{background:rgba(201,168,76,0.15);color:var(--gold)}
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:74px;z-index:20;background:var(--bg)}.tab-btn{flex:1;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2px solid transparent;transition:0.2s}
.tab-btn.active{border-bottom-color:var(--gold)}
.tab-btn .emoji{font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tab-btn.active .emoji{color:var(--gold)}
.tab-btn .label{font-size:10px;font-weight:500;color:var(--muted)}
.tab-btn.active .label{font-weight:700;color:var(--gold)}
.tab-content{padding:16px 14px;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.tab-panel{display:none}.tab-panel.active{display:block}
.q-top-bar{height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:var(--r) var(--r) 0 0}
.q-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q-title{font-size:20px;font-weight:700;color:var(--white);line-height:1.7;margin-bottom:10px}
.q-body{font-size:14px;color:var(--sec);line-height:1.85}
.vid-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:14px;font-weight:600;color:var(--gold)}
.vid-placeholder{width:100%;padding-bottom:56.25%;position:relative;background:rgba(0,0,0,0.3)}

.vid-placeholder-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.input-area textarea{width:100%;padding:12px;border-radius:var(--rs);border:1px solid var(--border);font-size:14px;resize:vertical;background:var(--input);color:var(--pri);outline:none;line-height:1.7}
.input-area textarea:focus{border-color:var(--gold-b)}
.responses-header{display:flex;justify-content:space-between;align-items:center}
.responses-header span:first-child{font-size:15px;font-weight:700;color:var(--white)}

.resp-card{display:flex;gap:12px;padding:14px}

.resp-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}

.forum-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}

.thread-card{padding:14px;cursor:pointer}

.thread-meta{font-size:11px;color:var(--muted)}
.thread-author-mg{color:var(--gold)!important}
.official-card{border-color:var(--gold-b)!important}
.official-card .of-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.official-card img{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.official-card .of-name{font-weight:700;font-size:13px;color:var(--gold)}
.official-card .of-text{font-size:14px;color:var(--pri);line-height:1.85}
.quiz-intro{text-align:center;padding:36px 20px}
.quiz-icon{width:70px;height:70px;border-radius:50%;margin:0 auto 18px;background:var(--gold-dim);border:2px solid var(--gold-b);display:flex;align-items:center;justify-content:center;font-size:32px}
.quiz-title{font-size:22px;font-weight:800;color:var(--white);margin-bottom:6px}
.quiz-sub{font-size:14px;color:var(--sec);margin-bottom:4px}
.quiz-info{font-size:12px;color:var(--muted)}
.quiz-rules{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--sec)}
.quiz-progress{display:flex;align-items:center;gap:10px}
.quiz-progress .num{font-size:12px;color:var(--muted)}

.q-question{font-size:18px;font-weight:700;color:var(--white);line-height:1.7}
.opt-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--card);font-size:15px;color:var(--pri);font-weight:500;text-align:inherit;transition:0.2s;width:100%}
.opt-btn.correct{background:var(--ok-bg);border-color:rgba(93,186,114,0.4);color:var(--ok)}
.opt-btn.wrong{background:var(--err-bg);border-color:rgba(212,85,85,0.4);color:var(--err)}
.opt-circle{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--border);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt-btn.correct .opt-circle{background:rgba(93,186,114,0.15);border-color:var(--ok);color:var(--ok)}
.opt-btn.wrong .opt-circle{background:rgba(212,85,85,0.15);border-color:var(--err);color:var(--err)}
.explanation{font-size:14px;color:var(--pri);line-height:1.8}
.result-circle{width:90px;height:90px;border-radius:50%;margin:0 auto 16px;background:rgba(201,168,76,0.1);border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center}

.result-of{font-size:11px;color:var(--muted)}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);margin-bottom:4px}
.hist-row.ok{background:var(--ok-bg)}.hist-row.fail{background:var(--err-bg)}
.hist-row .icon{font-size:14px}.hist-row.ok .icon{color:var(--ok)}.hist-row.fail .icon{color:var(--err)}
.hist-row .txt{font-size:13px;color:var(--pri)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:16px 8px 0}
.pod-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:100px}
.pod-medal{font-size:26px}
.pod-name{font-size:11px;font-weight:700;color:var(--white);text-align:center}
.pod-bar{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pod-pts{font-size:18px;font-weight:800}.pod-lbl{font-size:9px;color:var(--muted)}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.lb-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.lb-name{font-size:14px;font-weight:600;color:var(--pri)}
.lb-stats{font-size:11px;color:var(--muted)}
.lb-pts{font-size:16px;font-weight:800}
.my-stats{display:flex;justify-content:space-around;text-align:center}
.my-stats .val{font-size:20px;font-weight:800;color:var(--gold-l)}
.my-stats .lbl{font-size:10px;color:var(--muted);margin-top:2px}
.loading{display:flex;justify-content:center;padding:40px;color:var(--muted);font-size:14px}
.hidden{display:none!important}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(15,15,15,0.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);border-radius:18px 18px 0 0;display:flex;height:64px;padding-bottom:env(safe-area-inset-bottom)}
.light .bottom-nav{background:rgba(245,240,232,0.97)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.58rem;font-weight:500;cursor:pointer;border:none;background:none;font-family:var(--font);transition:color .2s;text-decoration:none}
.bn-item.active{color:#E8C040}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.yt-wrap{position:relative;width:100%;padding-bottom:56.25%;border-radius:0 0 var(--r) var(--r);overflow:hidden;max-height:220px}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;max-height:220px}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyD9HKATYu3y5mO-sIheHeob_6yb8HwOlbA",
  authDomain: "moshe-ginzy.firebaseapp.com",
  projectId: "moshe-ginzy",
  storageBucket: "moshe-ginzy.firebasestorage.app",
  messagingSenderId: "310969098073",
  appId: "1:310969098073:web:77f81033d31bef6ecaf648",
  measurementId: "G-QMVFWXLFP4"
});
var db = firebase.firestore();
var auth = firebase.auth();
try { firebase.analytics(); } catch(e){}

var currentUser = null;
var currentQuizQuestions = [];
var userStats = { totalPts: 0, quizCount: 0, bestStreak: 0 };
var firebaseLeaders = [];
var allFirebaseQuestions = [];
var quizAttempt = 0;
var lang = "he", isDark = true;
var currentTab = "question";
var quizStep = "intro", qi = 0, qSel = null, qDone = false, qScore = 0, qHist = [];
var questionResponses = [];
  var firebaseResponses = [];
var showVideo = true;
var votedSet = new Set();
var forumFilter = 0;
var selectedThread = null;

var MOSHE_PHOTO = "https://raw.githubusercontent.com/aginsberger-cpu/mosheginzy/main/moshe-photo.jpg";
document.getElementById("moshePhoto").src = MOSHE_PHOTO;

/* HEBREW DATE */
function getHebrewDate() {
  try {
    var f = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day:'numeric', month:'long', year:'numeric' });
    return f.format(new Date());
  } catch(e) { return ""; }
}
function getHebrewDateEn() {
  try {
    var f = new Intl.DateTimeFormat('en-US-u-ca-hebrew', { day:'numeric', month:'long', year:'numeric' });
    return f.format(new Date());
  } catch(e) { return ""; }
}
/* AUTH + LOAD */
auth.signInAnonymously().then(function(cred) {
  currentUser = cred.user;
  loadWeeklyQuizFromFirebase();
  loadDailyQuestion();
   loadResponses();
  loadUserStats();
  loadLeaderboard();
  loadAll();
}).catch(function(e) {
  console.warn("Auth error:", e);
  loadAll();
});

/* LOAD USER STATS FROM FIREBASE */
function loadUserStats() {
  if (!currentUser) return;
  db.collection("quizScores").where("uid", "==", currentUser.uid).get().then(function(snap) {
    var totalPts = 0;
    var quizCount = 0;
    snap.forEach(function(doc) {
      var d = doc.data();
      totalPts += (d.score || 0);
      quizCount++;
    });
    userStats.totalPts = totalPts;
    userStats.quizCount = quizCount;
    if (currentTab === "leaderboard") renderLeaderboard();
  });
}

/* LOAD LEADERBOARD FROM FIREBASE */
function loadLeaderboard() {
  db.collection("quizScores").get().then(function(snap) {
    var byUser = {};
    snap.forEach(function(doc) {
      var d = doc.data();
      var uid = d.uid;
      if (!byUser[uid]) byUser[uid] = { uid: uid, totalPts: 0, quizCount: 0 };
      byUser[uid].totalPts += (d.score || 0);
      byUser[uid].quizCount++;
    });
    /* Convert to array and sort by points */
    firebaseLeaders = Object.values(byUser).sort(function(a, b) { return b.totalPts - a.totalPts; }).slice(0, 10);
    /* Assign display names */
    var heNames = ["לומד א׳","לומד ב׳","לומד ג׳","לומד ד׳","לומד ה׳","לומד ו׳","לומד ז׳","לומד ח׳","לומד ט׳","לומד י׳"];
    var enNames = ["Learner A","Learner B","Learner C","Learner D","Learner E","Learner F","Learner G","Learner H","Learner I","Learner J"];
    firebaseLeaders.forEach(function(u, i) {
      u.heName = heNames[i] || "לומד";
      u.enName = enNames[i] || "Learner";
      /* Mark if this is the current user */
      u.isMe = currentUser && u.uid === currentUser.uid;
      if (u.isMe) {
        u.heName = "אתה 🌟";
        u.enName = "You 🌟";
      }
    });
    if (currentTab === "leaderboard") renderLeaderboard();
  });
}

/* LOAD QUIZ FROM FIREBASE */
function loadWeeklyQuizFromFirebase() {
  db.collection("quizQuestions").get().then(function(snap) {
    if (snap.empty) return;
    allFirebaseQuestions = [];
    snap.forEach(function(doc) { allFirebaseQuestions.push(doc.data()); });
    pickQuizQuestions();
    if (currentTab === "quiz") renderQuizIntro();
  });
}

/* Pick 8 questions - different each attempt */
function pickQuizQuestions() {
  if (allFirebaseQuestions.length === 0) return;
  var today = new Date();
  var dayNum = Math.floor(today.getTime() / 86400000);
  var seed = dayNum * 100 + quizAttempt;

  function seededRandom(s) {
    var x = Math.sin(s) * 10000;
    return x - Math.floor(x);
  }

  var shuffled = allFirebaseQuestions.slice();
  for (var i = shuffled.length - 1; i > 0; i--) {
    var j = Math.floor(seededRandom(seed + i) * (i + 1));
    var temp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = temp;
  }
  currentQuizQuestions = shuffled.slice(0, 8);
}

/* GET QUIZ QUESTIONS - always prefer Firebase, fallback to hardcoded */
function getQQ() {
  /* Use Firebase questions for both languages, fallback to hardcoded */
  if (currentQuizQuestions.length > 0) return currentQuizQuestions;
  return t().quizQ;
}

/* i18n */

  function loadResponses() {

function getVideoId(url) {
  if (!url) return null;
  var match = url.match(/[?&]v=([^&]+)/);
  if (match) return match[1];
  match = url.match(/youtu\.be\/([^?]+)/);
  if (match) return match[1];
  match = url.match(/shorts\/([^?&/]+)/);
  if (match) return match[1];
  match = url.match(/embed\/([^?&/]+)/);
  if (match) return match[1];
  return null;
}

function sendReplyToResp(id) {
  var box = document.getElementById("replyBox_" + id);

  var ta = box.querySelector("textarea");
  var text = ta.value.trim();

  db.collection("responses").doc(id).update({
    replies: firebase.firestore.FieldValue.arrayUnion({ text: text, ts: new Date().toISOString() })
  }).catch(function(){});
  ta.value = "";
  box.style.display = "none";
}

function reactToResp(id, emoji) {
  db.collection("responses").doc(id).get().then(function(doc) {

    reacts[emoji] = (reacts[emoji] || 0) + 1;
    db.collection("responses").doc(id).update({ reactions: reacts });
  });
}

function renderQuizQuestion() {
  var s = t();

  c.innerHTML =
    '<div class="quiz-progress"><span class="num">' + (qi + 1) + '/' + QQ.length + '</span><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div><span class="badge">' + qScore + ' ' + s.pts + '</span></div>' +
    '<div class="glass glow" style="padding:22px 18px"><div class="q-question">' + q.q + '</div></div>' +
    q.opts.map(function(opt, i) {
      var cls = "opt-btn";
      var circText = letters[i];
      if (qDone && i === q.c) { cls += " correct"; circText = "✓"; }
      else if (qDone && i === qSel && i !== q.c) { cls += " wrong"; circText = "✗"; }
      return '<button class="' + cls + '" onclick="quizAnswer(' + i + ')" ' + (qDone ? 'disabled' : '') + '><div class="opt-circle">' + circText + '</div>' + opt + '</button>';
    }).join('') +
    (qDone ? '<div class="glass" style="background:' + (qSel === q.c ? 'var(--ok-bg)' : 'rgba(201,168,76,0.05)') + ';border-color:' + (qSel === q.c ? 'rgba(93,186,114,0.2)' : 'var(--gold-b)') + '"><div class="explanation"><strong style="color:' + (qSel === q.c ? 'var(--ok)' : 'var(--gold)') + '">' + (qSel === q.c ? s.correct : s.incorrect) + '</strong>' + q.ex + '</div></div><button class="gold-btn" onclick="quizNext()">' + (qi < QQ.length - 1 ? s.nextQ : s.finish) + '</button>' : '');
}

function quizAnswer(i) {
  if (qDone) return;
  qSel = i;
  qDone = true;
  var QQ = getQQ();
  var q = QQ[qi];
  if (i === q.c) qScore++;
  qHist.push({ q: q.q, ok: i === q.c });
  renderQuizQuestion();
}

function quizNext() {
  var QQ = getQQ();
  if (qi < QQ.length - 1) { qi++; qSel = null; qDone = false; renderQuizQuestion(); }
  else renderQuizResults();
}

  var s = t();

  if (L.length === 0) {
    c.innerHTML =
      '<div><h2 style="font-size:18px;font-weight:700;color:var(--white);margin-bottom:2px">' + s.lbTitle + '</h2><p style="font-size:12px;color:var(--muted)">' + s.lbSub + '</p></div>' +
      '<div class="glass glow" style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">🏆</div><p style="font-size:16px;font-weight:600;color:var(--white);margin-bottom:8px">' + (lang === 'he' ? 'הדירוג ריק עדיין' : 'No rankings yet') + '</p><p style="font-size:14px;color:var(--sec)">' + (lang === 'he' ? 'ענו על חידונים כדי להופיע בדירוג!' : 'Complete quizzes to appear on the leaderboard!') + '</p></div>' +
      '<div class="glass glow"><h3 style="font-size:13px;font-weight:600;color:var(--gold);margin-bottom:12px">' + s.yourStats + '</h3><div class="my-stats">' +
      [{v:userStats.totalPts.toString(),l:s.yourPts},{v:getUserRank(),l:s.yourRank},{v:"0",l:s.yourStreak},{v:userStats.quizCount.toString(),l:s.yourQuizzes}].map(function(x) { return '<div><div class="val">' + x.v + '</div><div class="lbl">' + x.l + '</div></div>'; }).join('') + '</div></div>';
    return;
  }

  /* Build podium (only if 3+ users) */
  var podiumHtml = '';
  if (L.length >= 3) {
    podiumHtml = '<div class="glass glow" style="padding:16px 8px 0;overflow:hidden"><div class="podium">' +
    [1, 0, 2].map(function(idx) {
      var u = L[idx];
      var name = lang === 'he' ? u.heName : u.enName;
      return '<div class="pod-col"><span class="pod-medal" ' + (idx === 0 ? 'style="font-size:26px"' : 'style="font-size:20px"') + '>' + medals[idx] + '</span><div class="avatar" style="width:' + (idx === 0 ? 44 : 36) + 'px;height:' + (idx === 0 ? 44 : 36) + 'px;font-size:' + (idx === 0 ? 16 : 13) + 'px;' + (u.isMe ? 'border-color:var(--gold);border-width:2px' : '') + '">' + name[0] + '</div><span class="pod-name">' + name + '</span><div class="pod-bar" style="height:' + podH[idx] + 'px;background:linear-gradient(180deg,' + podC[idx] + '25,' + podC[idx] + '08);border:1px solid ' + podC[idx] + '30;border-bottom:none"><span class="pod-pts" style="color:' + podC[idx] + '">' + u.totalPts + '</span><span class="pod-lbl">' + s.points + '</span></div></div>';
    }).join('') + '</div></div>';
  }

  c.innerHTML =
    '<div><h2 style="font-size:18px;font-weight:700;color:var(--white);margin-bottom:2px">' + s.lbTitle + '</h2><p style="font-size:12px;color:var(--muted)">' + s.lbSub + '</p></div>' +
    podiumHtml +
    L.map(function(u, idx) {
      var r = idx + 1;
      var name = lang === 'he' ? u.heName : u.enName;
      return '<div class="glass lb-row" style="' + (r <= 3 ? (lang === 'he' ? 'border-right' : 'border-left') + ':3px solid ' + podC[r - 1] : '') + (u.isMe ? ';background:var(--gold-dim)' : '') + '"><div class="lb-rank" style="background:' + (r <= 3 ? podC[r - 1] + '20' : 'var(--border)') + ';color:' + (r <= 3 ? podC[r - 1] : 'var(--muted)') + '">' + r + '</div><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:1px"><span class="lb-name">' + name + '</span></div><span class="lb-stats">📝 ' + u.quizCount + ' ' + s.quizzes + ' · ' + u.totalPts + ' ' + s.points + '</span></div><span class="lb-pts" style="color:' + (r <= 3 ? podC[r - 1] : 'var(--muted)') + '">' + u.totalPts + '</span></div>';
    }).join('') +
    '<div class="glass glow"><h3 style="font-size:13px;font-weight:600;color:var(--gold);margin-bottom:12px">' + s.yourStats + '</h3><div class="my-stats">' +
    [{v:userStats.totalPts.toString(),l:s.yourPts},{v:getUserRank(),l:s.yourRank},{v:"0",l:s.yourStreak},{v:userStats.quizCount.toString(),l:s.yourQuizzes}].map(function(x) { return '<div><div class="val">' + x.v + '</div><div class="lbl">' + x.l + '</div></div>'; }).join('') + '</div></div>';
}

/* INIT */
var urlParams = new URLSearchParams(window.location.search);
var tabParam = urlParams.get("tab");
if (tabParam && ["question","forum","quiz","leaderboard"].indexOf(tabParam) !== -1) {
  switchTab(tabParam);
}
var langParam = urlParams.get("lang");
if (langParam && ["he","en"].indexOf(langParam) !== -1) {
  setLang(langParam);
}

document.getElementById("moshePhoto").onerror = function() {
  this.style.background = "linear-gradient(135deg, var(--gold), var(--gold-l))";
  this.style.display = "flex";
  this.alt = "מג";
};
  // SWIPE BETWEEN TABS
(function(){
  var tabs = ['question','forum','quiz','leaderboard'];
  var startX = 0;
  document.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    var diff = startX - e.changedTouches[0].clientX;
    if(Math.abs(diff) < 60) return;
    var current = tabs.indexOf(currentTab);
    if(current === -1) return;
    if(diff > 0 && current < tabs.length-1) switchTab(tabs[current+1]);
    else if(diff < 0 && current > 0) switchTab(tabs[current-1]);
  }, {passive:true});
})();
</script>
