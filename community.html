<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>משה גינזי — קהילה</title>
<style>
:root {
  --bg:#0d0d0d; --card:rgba(25,25,28,0.85); --input:rgba(45,45,50,0.6);
  --gold:#c9a84c; --gold-l:#e8d48b; --gold-dim:rgba(201,168,76,0.15); --gold-b:rgba(201,168,76,0.25);
  --white:#f0ece2; --pri:#e8e4da; --sec:#9e9a90; --muted:#6b6860;
  --border:rgba(255,255,255,0.07); --ok:#5dba72; --ok-bg:rgba(93,186,114,0.12);
  --err:#d45555; --err-bg:rgba(212,85,85,0.12);
  --font:'Segoe UI',-apple-system,Arial,sans-serif;
  --r:14px; --rs:10px;
}
.light {
  --bg:#faf7f0; --card:rgba(255,255,255,0.92); --input:rgba(245,242,235,0.8);
  --gold:#9e7c2e; --gold-l:#c9a84c; --gold-dim:rgba(158,124,46,0.1); --gold-b:rgba(158,124,46,0.2);
  --white:#1a1a2e; --pri:#2c2c3e; --sec:#5a5a6e; --muted:#8a8a98;
  --border:rgba(0,0,0,0.08); --ok:#2d8a56; --ok-bg:rgba(45,138,86,0.08);
  --err:#c44040; --err-bg:rgba(196,64,64,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--pri);min-height:100vh;max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
textarea{font-family:var(--font)}
.glass{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;box-shadow:0 3px 16px rgba(0,0,0,0.25)}
.glass.glow{border-color:var(--gold-b);box-shadow:0 0 24px rgba(201,168,76,0.06)}
.badge{background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600;border:1px solid var(--gold-b);display:inline-block}
.avatar{border-radius:50%;background:rgba(201,168,76,0.12);border:1.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;flex-shrink:0}
.gold-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#0d0d0d;padding:12px 22px;border-radius:var(--rs);font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(201,168,76,0.2);transition:all 0.2s;width:100%}
.light .gold-btn{color:#fff}
.gold-btn:disabled{background:var(--border);color:var(--muted);box-shadow:none}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;padding:13px 20px;border-radius:var(--r);font-size:15px;font-weight:600;width:100%}

/* Header */
.header{padding:16px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.header img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.header h1{font-size:19px;font-weight:700;color:var(--gold);font-style:italic}
.header .sub{font-size:11px;color:var(--muted);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{background:var(--border);border-radius:20px;padding:6px 10px;font-size:14px}
.lang-wrap{display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--gold-b)}
.lang-btn{padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);transition:0.2s}
.lang-btn.active{background:rgba(201,168,76,0.15);color:var(--gold)}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;background:var(--bg)}
.tab-btn{flex:1;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2px solid transparent;transition:0.2s}
.tab-btn.active{border-bottom-color:var(--gold)}
.tab-btn .emoji{font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tab-btn.active .emoji{color:var(--gold)}
.tab-btn .label{font-size:10px;font-weight:500;color:var(--muted)}
.tab-btn.active .label{font-weight:700;color:var(--gold)}
.tab-content{padding:16px 14px;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.tab-panel{display:none}.tab-panel.active{display:block}

/* Question */
.q-top-bar{height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:var(--r) var(--r) 0 0}
.q-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q-title{font-size:20px;font-weight:700;color:var(--white);line-height:1.7;margin-bottom:10px}
.q-body{font-size:14px;color:var(--sec);line-height:1.85}
.vid-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:14px;font-weight:600;color:var(--gold)}
.vid-placeholder{width:100%;padding-bottom:56.25%;position:relative;background:rgba(0,0,0,0.3)}
.light .vid-placeholder{background:rgba(0,0,0,0.05)}
.vid-placeholder-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.vid-play{width:64px;height:64px;border-radius:50%;background:rgba(201,168,76,0.1);border:2px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gold)}
.input-area textarea{width:100%;padding:12px;border-radius:var(--rs);border:1px solid var(--border);font-size:14px;resize:vertical;background:var(--input);color:var(--pri);outline:none;line-height:1.7}
.input-area textarea:focus{border-color:var(--gold-b)}
.responses-header{display:flex;justify-content:space-between;align-items:center}
.responses-header span:first-child{font-size:15px;font-weight:700;color:var(--white)}
.responses-header span:last-child{font-size:12px;color:var(--muted)}
.resp-card{display:flex;gap:12px;padding:14px}
.resp-vote{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
.resp-vote .heart{font-size:16px;color:var(--muted);cursor:pointer;transition:0.2s}
.resp-vote .heart.voted{color:var(--gold)}
.resp-vote .count{font-size:13px;font-weight:700;color:var(--muted)}
.resp-vote .count.voted{color:var(--gold)}
.resp-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.resp-author{font-weight:600;font-size:13px;color:var(--pri)}
.resp-time{font-size:11px;color:var(--muted)}
.resp-text{font-size:14px;color:var(--pri);line-height:1.8}

/* Forum */
.forum-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cat-btn{padding:7px 14px;border-radius:18px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap;background:var(--border);color:var(--muted);transition:0.2s}
.cat-btn.active{border-color:var(--gold-b);background:rgba(201,168,76,0.1);color:var(--gold)}
.thread-card{padding:14px;cursor:pointer}
.thread-title{font-size:14px;font-weight:600;color:var(--white);line-height:1.5;margin-bottom:4px}
.thread-meta{font-size:11px;color:var(--muted)}
.thread-author-mg{color:var(--gold)!important}
.official-card{border-color:var(--gold-b)!important}
.official-card .of-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.official-card img{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.official-card .of-name{font-weight:700;font-size:13px;color:var(--gold)}
.official-card .of-text{font-size:14px;color:var(--pri);line-height:1.85}

/* Quiz */
.quiz-intro{text-align:center;padding:36px 20px}
.quiz-icon{width:70px;height:70px;border-radius:50%;margin:0 auto 18px;background:var(--gold-dim);border:2px solid var(--gold-b);display:flex;align-items:center;justify-content:center;font-size:32px}
.quiz-title{font-size:22px;font-weight:800;color:var(--white);margin-bottom:6px}
.quiz-sub{font-size:14px;color:var(--sec);margin-bottom:4px}
.quiz-info{font-size:12px;color:var(--muted)}
.quiz-rules{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--sec)}
.quiz-progress{display:flex;align-items:center;gap:10px}
.quiz-progress .num{font-size:12px;color:var(--muted)}
.quiz-progress .bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.quiz-progress .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:2px;transition:width 0.4s}
.q-question{font-size:18px;font-weight:700;color:var(--white);line-height:1.7}
.opt-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--card);font-size:15px;color:var(--pri);font-weight:500;text-align:inherit;transition:0.2s;width:100%}
.opt-btn.correct{background:var(--ok-bg);border-color:rgba(93,186,114,0.4);color:var(--ok)}
.opt-btn.wrong{background:var(--err-bg);border-color:rgba(212,85,85,0.4);color:var(--err)}
.opt-circle{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--border);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt-btn.correct .opt-circle{background:rgba(93,186,114,0.15);border-color:var(--ok);color:var(--ok)}
.opt-btn.wrong .opt-circle{background:rgba(212,85,85,0.15);border-color:var(--err);color:var(--err)}
.explanation{font-size:14px;color:var(--pri);line-height:1.8}
.result-circle{width:90px;height:90px;border-radius:50%;margin:0 auto 16px;background:rgba(201,168,76,0.1);border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center}
.result-score{font-size:26px;font-weight:800;color:var(--gold)}
.result-of{font-size:11px;color:var(--muted)}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);margin-bottom:4px}
.hist-row.ok{background:var(--ok-bg)}.hist-row.fail{background:var(--err-bg)}
.hist-row .icon{font-size:14px}.hist-row.ok .icon{color:var(--ok)}.hist-row.fail .icon{color:var(--err)}
.hist-row .txt{font-size:13px;color:var(--pri)}

/* Leaderboard */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:16px 8px 0}
.pod-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:100px}
.pod-medal{font-size:26px}
.pod-name{font-size:11px;font-weight:700;color:var(--white);text-align:center}
.pod-bar{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pod-pts{font-size:18px;font-weight:800}.pod-lbl{font-size:9px;color:var(--muted)}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.lb-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.lb-name{font-size:14px;font-weight:600;color:var(--pri)}
.lb-stats{font-size:11px;color:var(--muted)}
.lb-pts{font-size:16px;font-weight:800}
.my-stats{display:flex;justify-content:space-around;text-align:center}
.my-stats .val{font-size:20px;font-weight:800;color:var(--gold-l)}
.my-stats .lbl{font-size:10px;color:var(--muted);margin-top:2px}

/* Loading */
.loading{display:flex;justify-content:center;padding:40px;color:var(--muted);font-size:14px}
.hidden{display:none!important}

/* YouTube embed */
.yt-wrap{position:relative;width:100%;padding-bottom:56.25%;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
</style>
</head>

function toggleVideo() { showVideo = !showVideo; renderQuestion(); }

function voteResp(id) {
  if (votedSet.has(id)) votedSet.delete(id);
  else votedSet.add(id);
  if (currentUser) {
    db.collection("votes").doc(currentUser.uid + "_" + id).set({ voted: votedSet.has(id), ts: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
  }
  renderQuestion();
}

function submitResponse() {
  const input = document.getElementById("respInput");
  const text = input.value.trim();
  if (!text) return;
  if (currentUser) {
    db.collection("responses").add({
      uid: currentUser.uid,
      text: text,
      votes: 0,
      ts: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(()=>{});
  }
  input.value = "";
  const msg = document.getElementById("sentMsg");
  msg.classList.remove("hidden");
  setTimeout(() => msg.classList.add("hidden"), 3000);
}

function shareWhatsApp() {
  const s = t();

    </div>

function startQuiz() { quizStep = "play"; renderQuizQuestion(); }

function renderQuizQuestion() {
  const s = t();
 const QQ = currentQuizQuestions.length > 0 ? currentQuizQuestions : s.quizQ;
  const q = QQ[qi];
  const c = document.getElementById("quizContent");
  const pct = ((qi + (qDone ? 1 : 0)) / QQ.length) * 100;
  const letters = lang === "he" ? ["א","ב","ג","ד"] : ["A","B","C","D"];

  c.innerHTML = `
    <div class="quiz-progress">
      <span class="num">${qi + 1}/${QQ.length}</span>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <span class="badge">${qScore} ${s.pts}</span>
    </div>
    <div class="glass glow" style="padding:22px 18px"><div class="q-question">${q.q}</div></div>
    ${q.opts.map((opt, i) => {
      let cls = "opt-btn";
      let circCls = "opt-circle";
      let circText = letters[i];
      if (qDone && i === q.c) { cls += " correct"; circText = "✓"; }
      else if (qDone && i === qSel && i !== q.c) { cls += " wrong"; circText = "✗"; }
      return `<button class="${cls}" onclick="quizAnswer(${i})" ${qDone ? 'disabled' : ''}>
        <div class="${circCls}">${circText}</div>${opt}</button>`;
    }).join('')}
    ${qDone ? `
      <div class="glass" style="background:${qSel === q.c ? 'var(--ok-bg)' : 'rgba(201,168,76,0.05)'};border-color:${qSel === q.c ? 'rgba(93,186,114,0.2)' : 'var(--gold-b)'}">
        <div class="explanation"><strong style="color:${qSel === q.c ? 'var(--ok)' : 'var(--gold)'}">${qSel === q.c ? s.correct : s.incorrect}</strong>${q.ex}</div>
      </div>
      <button class="gold-btn" onclick="quizNext()">${qi < QQ.length - 1 ? s.nextQ : s.finish}</button>
    ` : ''}
  `;
}

function quizAnswer(i) {
  if (qDone) return;
  qSel = i;
  qDone = true;
  const q = t().quizQ[qi];
  if (i === q.c) qScore++;
  qHist.push({ q: q.q, ok: i === q.c });
  renderQuizQuestion();
}

function quizNext() {
  if (qi < t().quizQ.length - 1) { qi++; qSel = null; qDone = false; renderQuizQuestion(); }
  else renderQuizResults();
}

function renderQuizResults() {
  const s = t();
  const QQ = s.quizQ;
  const pct = Math.round((qScore / QQ.length) * 100);
  const m = pct === 100 ? s.perfect : pct >= 66 ? s.great : pct >= 50 ? s.ok : s.low;
  const c = document.getElementById("quizContent");

  if (currentUser) {
    db.collection("quizScores").add({
      uid: currentUser.uid, score: qScore, total: QQ.length, pct: pct,
      ts: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(()=>{});
  }

  c.innerHTML = `
    <div class="glass glow" style="text-align:center;padding:28px 18px">
      <div class="result-circle"><span class="result-score">${qScore}</span><span class="result-of">${s.outOf} ${QQ.length}</span></div>
      <h2 style="font-size:20px;font-weight:800;color:var(--white);margin-bottom:4px">${m.t}</h2>
      <p style="font-size:14px;color:var(--sec)">${m.s}</p>
    </div>
    <div class="glass">
      <h3 style="font-size:13px;font-weight:600;color:var(--sec);margin-bottom:8px">${s.summary}</h3>
      ${qHist.map(h => `<div class="hist-row ${h.ok ? 'ok' : 'fail'}"><span class="icon">${h.ok ? '✓' : '✗'}</span><span class="txt">${h.q}</span></div>`).join('')}
    </div>
    <div style="display:flex;gap:8px">
      <button class="gold-btn" onclick="renderQuizIntro()">${s.tryAgain}</button>
      <button class="wa-btn" style="flex:1" onclick="shareQuiz()">📲 ${s.challenge}</button>
    </div>
  `;
}

function shareQuiz() {
  const s = t();
  const text = encodeURIComponent((lang === 'he' ? `קיבלתי ${qScore} מתוך ${t().quizQ.length} בחידון של משה גינזי! נסה גם:` : `I scored ${qScore}/${t().quizQ.length} on Moshe Ginzy's quiz! Try it:`) + "\nhttps://mosheginzy.com/community.html");
  window.open("https://wa.me/?text=" + text, "_blank");
}

/* ═══════════════════════════════════════
   4. LEADERBOARD
═══════════════════════════════════════ */
function renderLeaderboard() {
  const s = t();
  const L = s.leaders;
  const podC = ["#c9a84c", "#9eaab8", "#b07d4f"];
  const podH = [120, 95, 75];
  const medals = ["🥇", "🥈", "🥉"];
  const c = document.getElementById("leaderboardContent");

  c.innerHTML = `
    <div>
      <h2 style="font-size:18px;font-weight:700;color:var(--white);margin-bottom:2px">${s.lbTitle}</h2>
      <p style="font-size:12px;color:var(--muted)">${s.lbSub}</p>
    </div>
    <div class="glass glow" style="padding:16px 8px 0;overflow:hidden">
      <div class="podium">
        ${[1, 0, 2].map(idx => {
          const u = L[idx];
          return `<div class="pod-col">
            <span class="pod-medal" ${idx === 0 ? 'style="font-size:26px"' : 'style="font-size:20px"'}>${medals[idx]}</span>
            <div class="avatar" style="width:${idx === 0 ? 44 : 36}px;height:${idx === 0 ? 44 : 36}px;font-size:${idx === 0 ? 16 : 13}px">${u.name[0]}</div>
            <span class="pod-name">${u.name}</span>
            <div class="pod-bar" style="height:${podH[idx]}px;background:linear-gradient(180deg,${podC[idx]}25,${podC[idx]}08);border:1px solid ${podC[idx]}30;border-bottom:none">
              <span class="pod-pts" style="color:${podC[idx]}">${u.pts}</span>
              <span class="pod-lbl">${s.points}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${L.map(u => `
      <div class="glass lb-row" style="${u.r <= 3 ? (lang === 'he' ? 'border-right' : 'border-left') + ':3px solid ' + podC[u.r - 1] : ''}">
        <div class="lb-rank" style="background:${u.r <= 3 ? podC[u.r - 1] + '20' : 'var(--border)'};color:${u.r <= 3 ? podC[u.r - 1] : 'var(--muted)'}">${u.r}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:1px">
            <span class="lb-name">${u.name}</span><span class="badge">${u.badge}</span>
          </div>
          <span class="lb-stats">🔥 ${u.streak} ${s.days} · 📝 ${u.qz} ${s.quizzes} · 💬 ${u.ans} ${s.answers}</span>
        </div>
        <span class="lb-pts" style="color:${u.r <= 3 ? podC[u.r - 1] : 'var(--muted)'}">${u.pts}</span>
      </div>
    `).join('')}
    <div class="glass glow">
      <h3 style="font-size:13px;font-weight:600;color:var(--gold);margin-bottom:12px">${s.yourStats}</h3>
      <div class="my-stats">
        ${[{v:"0",l:s.yourPts},{v:"—",l:s.yourRank},{v:"0",l:s.yourStreak},{v:"0",l:s.yourQuizzes}].map(x => `<div><div class="val">${x.v}</div><div class="lbl">${x.l}</div></div>`).join('')}
      </div>
    </div>
  `;
}
