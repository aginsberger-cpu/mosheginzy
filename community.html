<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>משה גינזי — קהילה</title>
<style>
:root {
  --bg:#0d0d0d; --card:rgba(25,25,28,0.85); --input:rgba(45,45,50,0.6);
  --gold:#c9a84c; --gold-l:#e8d48b; --gold-dim:rgba(201,168,76,0.15); --gold-b:rgba(201,168,76,0.25);
  --white:#f0ece2; --pri:#e8e4da; --sec:#9e9a90; --muted:#6b6860;
  --border:rgba(255,255,255,0.07); --ok:#5dba72; --ok-bg:rgba(93,186,114,0.12);
  --err:#d45555; --err-bg:rgba(212,85,85,0.12);
  --font:'Segoe UI',-apple-system,Arial,sans-serif;
  --r:14px; --rs:10px;
}
.light {
  --bg:#faf7f0; --card:rgba(255,255,255,0.92); --input:rgba(245,242,235,0.8);
  --gold:#9e7c2e; --gold-l:#c9a84c; --gold-dim:rgba(158,124,46,0.1); --gold-b:rgba(158,124,46,0.2);
  --white:#1a1a2e; --pri:#2c2c3e; --sec:#5a5a6e; --muted:#8a8a98;
  --border:rgba(0,0,0,0.08); --ok:#2d8a56; --ok-bg:rgba(45,138,86,0.08);
  --err:#c44040; --err-bg:rgba(196,64,64,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--pri);min-height:100vh;max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
textarea,input{font-family:var(--font)}
.glass{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;box-shadow:0 3px 16px rgba(0,0,0,0.25)}
.glass.glow{border-color:var(--gold-b);box-shadow:0 0 24px rgba(201,168,76,0.06)}
.badge{background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600;border:1px solid var(--gold-b);display:inline-block}
.gold-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#0d0d0d;padding:12px 22px;border-radius:var(--rs);font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(201,168,76,0.2);transition:all 0.2s;width:100%}
.light .gold-btn{color:#fff}
.gold-btn:disabled{background:var(--border);color:var(--muted);box-shadow:none}

.header{padding:16px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.header img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.header h1{font-size:19px;font-weight:700;color:var(--gold);font-style:italic}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{background:var(--border);border-radius:20px;padding:6px 10px;font-size:14px}
.lang-wrap{display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--gold-b)}
.lang-btn{padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);transition:0.2s}
.lang-btn.active{background:rgba(201,168,76,0.15);color:var(--gold)}

.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;background:var(--bg)}
.tab-btn{flex:1;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2px solid transparent;transition:0.2s}
.tab-btn.active{border-bottom-color:var(--gold)}
.tab-btn .emoji{font-size:16px}
.tab-btn .label{font-size:10px;font-weight:500;color:var(--muted)}
.tab-btn.active .label{font-weight:700;color:var(--gold)}
.tab-content{padding:16px 14px;display:none;flex-direction:column;gap:14px;padding-bottom:40px}.tab-content.active{display:flex}

.loading{color:var(--muted);font-size:13px;padding:20px;text-align:center}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <img id="moshePhoto" src="" alt="Moshe Ginzy">
    <div>
      <h1>משה גינזי</h1>
      <div style="font-size:12px;color:var(--muted)">קהילת לימוד</div>
    </div>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
    <div class="lang-wrap">
      <button class="lang-btn active" id="btnHe" onclick="setLang('he')">עב</button>
      <button class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs" id="tabBar">
  <button class="tab-btn active" data-tab="question" onclick="switchTab('question')">
    <span class="emoji">💡</span><span class="label">שאלה</span>
  </button>
  <button class="tab-btn" data-tab="forum" onclick="switchTab('forum')">
    <span class="emoji">💬</span><span class="label">פורום</span>
  </button>
  <button class="tab-btn" data-tab="quiz" onclick="switchTab('quiz')">
    <span class="emoji">🏆</span><span class="label">חידון</span>
  </button>
  <button class="tab-btn" data-tab="leaderboard" onclick="switchTab('leaderboard')">
    <span class="emoji">⭐</span><span class="label">דירוג</span>
  </button>
</div>

<!-- QUESTION TAB -->
<div class="tab-content active" id="panel-question">
  <div id="questionContent" class="loading">טוען...</div>
</div>

<!-- FORUM TAB -->
<div class="tab-content" id="panel-forum">
  <div id="forumContent" class="loading">טוען...</div>
</div>

<!-- QUIZ TAB -->
<div class="tab-content" id="panel-quiz">
  <div id="quizContent" class="loading">טוען...</div>
</div>

<!-- LEADERBOARD TAB -->
<div class="tab-content" id="panel-leaderboard">
  <div id="leaderboardContent" class="loading">טוען...</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9HKATYu3y5mO-sIheHeob_6yb8HwOlbA",
  authDomain: "moshe-ginzy.firebaseapp.com",
  projectId: "moshe-ginzy",
  storageBucket: "moshe-ginzy.firebasestorage.app",
  messagingSenderId: "310969098073",
  appId: "1:310969098073:web:77f81033d31bef6ecaf648",
  measurementId: "G-QMVFWXLFP4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
try { firebase.analytics(); } catch(e){}

let currentUser = null;
let lang = "he", isDark = true;
const MOSHE_PHOTO = "https://raw.githubusercontent.com/aginsberger-cpu/mosheginzy/main/moshe-photo.jpg";

document.getElementById("moshePhoto").src = MOSHE_PHOTO;

auth.signInAnonymously().then(cred => { 
  currentUser = cred.user; 
  loadAll(); 
}).catch(e => { 
  console.warn("Auth error:", e); 
  loadAll(); 
});

/* i18n */
const T = {
  he: { dir:"rtl", q:"שאלת היום", f:"פורום", z:"חידון", l:"דירוג" },
  en: { dir:"ltr", q:"Daily Q", f:"Forum", z:"Quiz", l:"Rankings" }
};

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle("light", !isDark);
  document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
}

function setLang(l) {
  lang = l;
  document.documentElement.dir = T[l].dir;
  document.documentElement.lang = l;
  document.getElementById("btnHe").classList.toggle("active", l === "he");
  document.getElementById("btnEn").classList.toggle("active", l === "en");
  loadAll();
}

let currentTab = "question";
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tab-content").forEach(p => p.classList.toggle("active", p.id === "panel-" + tab));
  loadTab(tab);
}

function loadAll() {
  loadTab("question");
  loadTab("forum");
  loadTab("quiz");
  loadTab("leaderboard");
}

function loadTab(tab) {
  if (tab === "question") loadQuestion();
  else if (tab === "forum") loadForum();
  else if (tab === "quiz") loadQuiz();
  else if (tab === "leaderboard") loadLeaderboard();
}

/* QUESTION */
function loadQuestion() {
  db.collection("dailyQuestions").orderBy("createdAt", "desc").limit(1).onSnapshot(snap => {
    const c = document.getElementById("questionContent");
    if (snap.empty) {
      c.innerHTML = '<div class="loading">אין שאלה עדיין</div>';
      return;
    }
    const q = snap.docs[0].data();
    c.innerHTML = `
      <div class="glass glow" style="padding:0;overflow:hidden">
        <div style="height:3px;background:linear-gradient(90deg,var(--gold),transparent)"></div>
        <div style="padding:18px 20px">
          <div style="font-size:20px;font-weight:700;color:var(--white);line-height:1.7;margin-bottom:10px">${q.title || q.q}</div>
          <div style="font-size:14px;color:var(--sec);line-height:1.85">${q.body || q.ex}</div>
        </div>
      </div>
      ${q.videoUrl ? `
        <div class="glass" style="padding:0;overflow:hidden">
          <div style="position:relative;width:100%;padding-bottom:56.25%">
            <iframe src="https://www.youtube.com/embed/${q.videoUrl.split('v=')[1]}" style="position:absolute;inset:0;width:100%;height:100%;border:none" allowfullscreen></iframe>
          </div>
        </div>
      ` : ''}
    `;
  });
}

/* FORUM */
function loadForum() {
  db.collection("forumThreads").orderBy("createdAt", "desc").onSnapshot(snap => {
    const c = document.getElementById("forumContent");
    let html = '';
    snap.forEach(doc => {
      const t = doc.data();
      html += `
        <div class="glass" style="cursor:pointer" onclick="alert('${t.title}')">
          <div style="font-size:14px;font-weight:600;color:var(--white);margin-bottom:4px">${t.title}</div>
          <div style="font-size:11px;color:var(--muted)">${t.author} • ${t.replies || 0} תגובות</div>
        </div>
      `;
    });
    if (!html) html = '<div class="loading">אין פוסטים בפורום</div>';
    c.innerHTML = html;
  });
}

/* QUIZ */
function loadQuiz() {
  db.collection("weeklyQuizzes").orderBy("createdAt", "desc").limit(1).onSnapshot(snap => {
    const c = document.getElementById("quizContent");
    if (snap.empty) {
      c.innerHTML = '<div class="glass" style="text-align:center;padding:30px"><div style="font-size:14px;color:var(--muted)">אין חידון עדיין. היכנס ל-admin.html וצור חידון!</div></div>';
      return;
    }
    const quiz = snap.docs[0].data();
    const questions = quiz.questions || [];
    c.innerHTML = `<div class="glass" style="text-align:center"><div style="font-size:14px;color:var(--white)">חידון עם ${questions.length} שאלות</div><div style="font-size:11px;color:var(--muted);margin-top:10px">שאלה ראשונה: ${questions[0]?.q || 'טוען...'}</div></div>`;
  });
}

/* LEADERBOARD */
function loadLeaderboard() {
  document.getElementById("leaderboardContent").innerHTML = '<div class="glass" style="text-align:center;padding:30px"><div style="font-size:14px;color:var(--muted)">דירוג יתעדכן כשמשתמשים ישחקו</div></div>';
}

document.getElementById("moshePhoto").onerror = function() {
  this.style.background = "linear-gradient(135deg, var(--gold), var(--gold-l))";
  this.style.display = "flex";
};
</script>
</body>
</html>
