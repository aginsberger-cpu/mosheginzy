  {q:"כמה מינים נשתבחה בהם ארץ ישראל?",opts:["5","6","7","8"],c:2,ex:"7 מינים: חיטה, שעורה, גפן, תאנה, רימון, זית ותמר."},
  {q:"מה שם היום שאחרי שבת?",opts:["יום ראשון","יום שני","יום שלישי","מוצאי שבת"],c:0,ex:"יום ראשון - היום הראשון בשבוע."},

];

function showMsg(text, ok) {
  document.getElementById("msg").innerHTML = '<div class="' + (ok ? 'ok' : 'err') + '">' + text + '</div>';
}

function updateProgress(n, total) {
  document.getElementById("fill").style.width = (n / total * 100) + "%";
  document.getElementById("stat").textContent = n + " / " + total;
}

async function startReset() {
  var btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "עובד...";

  try {
    await auth.signInAnonymously();

    // שלב 1: מחק חידונים ישנים
    showMsg("שלב 1: מוחק חידונים ישנים...", true);
    var quizSnap = await db.collection("weeklyQuizzes").get();
    for (var i = 0; i < quizSnap.docs.length; i++) {
      await quizSnap.docs[i].ref.delete();
    }
    showMsg("שלב 1: נמחקו " + quizSnap.size + " חידונים ישנים", true);

    // שלב 2: מחק שאלות ישנות
    showMsg("שלב 2: מוחק שאלות ישנות...", true);
    var qSnap = await db.collection("quizQuestions").get();
    var deleted = 0;
    for (var j = 0; j < qSnap.docs.length; j++) {
      await qSnap.docs[j].ref.delete();
      deleted++;
      if (deleted % 20 === 0) updateProgress(deleted, qSnap.size);
    }
    showMsg("שלב 2: נמחקו " + deleted + " שאלות ישנות", true);

    // שלב 3: הכנס שאלות חדשות בעברית
    showMsg("שלב 3: מכניס " + questions.length + " שאלות חדשות בעברית...", true);
    for (var k = 0; k < questions.length; k++) {
      await db.collection("quizQuestions").add({
        q: questions[k].q,
        opts: questions[k].opts,
        c: questions[k].c,
        ex: questions[k].ex,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      updateProgress(k + 1, questions.length);
    }
    showMsg("שלב 3: הוכנסו " + questions.length + " שאלות בעברית!", true);

    // שלב 4: צור חידון חדש
    showMsg("שלב 4: יוצר חידון חדש...", true);
    var allSnap = await db.collection("quizQuestions").get();
    var allDocs = [];
    allSnap.forEach(function(doc) { allDocs.push(doc.data()); });
    
    // ערבב אקראי
    for (var m = allDocs.length - 1; m > 0; m--) {
      var n = Math.floor(Math.random() * (m + 1));
      var temp = allDocs[m];
      allDocs[m] = allDocs[n];
      allDocs[n] = temp;
    }
    var selected = allDocs.slice(0, 8);
    
    await db.collection("weeklyQuizzes").add({
      questions: selected,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    showMsg("הצלחה! " + questions.length + " שאלות בעברית + חידון חדש עם 8 שאלות!", true);
    btn.textContent = "סיום!";
    
  } catch(err) {
    showMsg("שגיאה: " + err.message, false);
    btn.disabled = false;
    btn.textContent = "נסה שוב";
  }
}
