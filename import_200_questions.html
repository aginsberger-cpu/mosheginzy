function showMsg(text, ok = true) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "message " + (ok ? "ok" : "err");
  el.classList.remove("hidden");
}

function updateProgress(current, total) {
  const pct = (current / total) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progress").textContent = current + " / " + total;
}

async function importAllQuestions() {
  const btn = document.getElementById("importBtn");
  btn.disabled = true;
  btn.textContent = "טוען 200 שאלות...";
  
  try {
    await auth.signInAnonymously();
    
    let imported = 0;
    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      await db.collection("quizQuestions").add({
        q: q.q,
        opts: q.opts,
        c: q.c,
        ex: q.ex,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      imported++;
      updateProgress(imported, questions.length);
    }
    
    showMsg(`✓ הצלחה! הוכנסו ${imported} שאלות למאגר!`);
    btn.textContent = "✨ הכנס את כל 200 השאלות";
    setTimeout(() => {
      alert("מעולה! 🎉 עכשיו יש 200 שאלות בספריה. היכנס ל-admin.html וצור חידון חדש!");
    }, 1500);
    
  } catch (err) {
    showMsg("❌ שגיאה: " + err.message, false);
    btn.disabled = false;
    btn.textContent = "✨ הכנס את כל 200 השאלות";
  }
}
